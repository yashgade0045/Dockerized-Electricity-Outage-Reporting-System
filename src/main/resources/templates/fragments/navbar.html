<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--/*
  Shared navigation sidebar fragment.
  Include with: th:replace="~{fragments/navbar :: sidebar}"
*/-->
<nav th:fragment="sidebar" class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        <span>Outage System</span>
    </div>

    <div class="sidebar-section-label">Main</div>
    <ul class="sidebar-nav">
        <li>
            <a th:href="@{/}" id="nav-dashboard"
               th:classappend="${#strings.equals(pageTitle, 'Dashboard')} ? 'active'">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                </svg>
                Dashboard
            </a>
        </li>
        <li>
            <a th:href="@{/reports}" id="nav-reports"
               th:classappend="${#strings.startsWith(pageTitle, 'Outage') or #strings.startsWith(pageTitle, 'Report')} ? 'active'">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                All Reports
            </a>
        </li>
        <li>
            <a th:href="@{/reports/new}" id="nav-new-report">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                Report Outage
            </a>
        </li>
    </ul>

    <div class="sidebar-section-label" sec:authorize="hasRole('ADMIN')">Administration</div>
    <ul class="sidebar-nav" sec:authorize="hasRole('ADMIN')">
        <li>
            <a th:href="@{/h2-console}" target="_blank" id="nav-h2-console">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2">
                    <ellipse cx="12" cy="5" rx="9" ry="3"/>
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                </svg>
                Database Console
            </a>
        </li>
    </ul>

    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="user-avatar" sec:authentication="name">U</div>
            <div class="user-info">
                <span class="user-name" sec:authentication="name">User</span>
                <span class="user-role" sec:authorize="hasRole('ADMIN')">Administrator</span>
                <span class="user-role" sec:authorize="!hasRole('ADMIN')">Reporter</span>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" id="logoutBtn" class="btn-logout" title="Sign out">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </form>
    </div>
</nav>

<!--/* Reusable alert fragment */-->
<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success fade-in" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        <span th:text="${successMessage}">Success</span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-error fade-in" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span th:text="${errorMessage}">Error</span>
    </div>
</div>

</body>
</html>
