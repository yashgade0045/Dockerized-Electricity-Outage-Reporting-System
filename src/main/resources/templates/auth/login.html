<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign In — Electricity Outage Reporting System</title>
    <meta name="description" content="Sign in to the Electricity Outage Reporting System to view and manage outage reports."/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="login-body">

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
            </div>
            <h1 class="login-title">Outage Reporting</h1>
            <p class="login-subtitle">Electricity Utility Management System</p>
        </div>

        <!-- Success/Error Alerts -->
        <div th:if="${param.error}" class="alert alert-error" role="alert">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            Invalid username or password. Please try again.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" role="alert">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            You have been signed out successfully.
        </div>

        <!-- Login Form -->
        <form id="loginForm" th:action="@{/login}" method="post" class="login-form">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Enter your username" autocomplete="username" required autofocus/>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Enter your password" autocomplete="current-password" required/>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <div class="login-hint">
            <p><strong>Development credentials:</strong></p>
            <p>User: <code>user</code> / <code>user123</code></p>
            <p>Admin: <code>admin</code> / <code>admin123</code></p>
        </div>
    </div>
</div>

</body>
</html>
