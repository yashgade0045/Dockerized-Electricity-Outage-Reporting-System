# ============================================================
# Electricity Outage Reporting System — Application Properties
# ============================================================

# --- Application ---
spring.application.name=Electricity Outage Reporting System
server.port=8080

# --- H2 In-Memory Database (Local Development) ---
# NOTE: H2 data is lost when the application stops.
# For persistent local storage, switch to a file-based H2 URL:
#   spring.datasource.url=jdbc:h2:file:./data/outagedb
spring.datasource.url=jdbc:h2:mem:outagedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- H2 Console (development access only) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# --- Spring MVC ---
spring.mvc.hiddenmethod.filter.enabled=true

# --- Logging ---
logging.level.com.example.outage=INFO
logging.level.org.springframework.security=WARN

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.app.name=${spring.application.name}
management.info.app.version=1.0.0
